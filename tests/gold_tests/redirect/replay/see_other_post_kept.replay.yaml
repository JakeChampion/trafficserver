#
# With see_other_as_get off, a 303 on a POST is followed with a POST, which is
# how Traffic Server behaved before the setting existed.
#
# The POST deliberately carries no content. What this case pins is that the
# method survives, which is all the setting governs. Replaying content across a
# redirect is a separate matter and does not currently work: the followed request
# goes out with the original Content-Length and no body behind it. That predates
# this setting, so asserting it here would be testing an unrelated defect.
#
# Keyed on the URL rather than a uuid header: the request Traffic Server makes
# when it follows a redirect carries the original request's headers, so a uuid
# keyed rule would match the followed request against the rule that produced the
# redirect. The client is given --keys "/start" so it sends only the first
# transaction; the second is here so the origin has a rule for the request
# Traffic Server generates, and its method is the assertion.
#

meta:
  version: "1.0"

sessions:
- protocol:
    stack: http
  transactions:

  - client-request:
      method: "POST"
      version: "1.1"
      url: /start
      headers:
        fields:
        - [ Host, example.com ]
        - [ Content-Length, 0 ]

    server-response:
      status: 303
      reason: See Other
      headers:
        fields:
        - [ Location, /target ]
        - [ Content-Length, 0 ]

    proxy-response:
      status: 200

  - client-request:
      method: "POST"
      version: "1.1"
      url: /target
      headers:
        fields:
        - [ Host, example.com ]
        - [ Content-Length, 0 ]

    proxy-request:
      method: "POST"

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 8 ]
        - [ X-Followed, yes ]
      content:
        encoding: plain
        data: "followed"

    proxy-response:
      status: 200
