#
# RFC 10008 section 2.5: a 303 on a QUERY is followed with a GET, whatever see_other_as_get says.
#
# Keyed on the URL rather than a uuid header: the request Traffic Server makes
# when it follows a redirect carries the original request's headers, so a uuid
# keyed rule would match the followed request against the rule that produced the
# redirect. The client is given --keys "/start" so it sends only the first
# transaction; the second is here so the origin has a rule for the request
# Traffic Server generates, and its method is the assertion.
#

meta:
  version: "1.0"

sessions:
- protocol:
    stack: http
  transactions:

  - client-request:
      method: "QUERY"
      version: "1.1"
      url: /start
      headers:
        fields:
        - [ Host, example.com ]
        - [ Content-Type, text/plain ]
        - [ Content-Length, 8 ]
      content:
        encoding: plain
        data: "SELECT 1"

    server-response:
      status: 303
      reason: See Other
      headers:
        fields:
        - [ Location, /target ]
        - [ Content-Length, 0 ]

    proxy-response:
      status: 200

  - client-request:
      method: "GET"
      version: "1.1"
      url: /target
      headers:
        fields:
        - [ Host, example.com ]

    proxy-request:
      method: "GET"

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 8 ]
        - [ X-Followed, yes ]
      content:
        encoding: plain
        data: "followed"

    proxy-response:
      status: 200
