#
# Proxy-Authorization is a hop-by-hop header: with the default
# proxy.config.http.forward.proxy_auth_to_parent=0 it is consumed by ATS and
# must not be forwarded to the parent proxy. The Proxy Verifier server plays
# the parent here (parent_is_proxy=true, go_direct=false), so what it
# receives is exactly what ATS sends to a parent.
#

meta:
  version: "1.0"

autest:
  description: 'Verify Proxy-Authorization is stripped toward the parent by default'

  dns:
    name: 'dns-auth-default'

  server:
    name: 'server-auth-default'

  client:
    name: 'client-auth-default'

  ats:
    name: 'ts-auth-default'

    process_config:
      enable_cache: false

    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'http|parent_select'
      proxy.config.http.uncacheable_requests_bypass_parent: 0
      proxy.config.http.parent_proxy.self_detect: 0
      proxy.config.url_remap.remap_required: 0

    parent_config:
      - 'dest_domain=. parent="127.0.0.1:{SERVER_HTTP_PORT}" go_direct=false parent_is_proxy=true'

sessions:
- transactions:

  - client-request:
      method: GET
      version: '1.1'
      scheme: http
      url: /auth/default
      headers:
        fields:
        - [Host, example.com]
        - [Proxy-Authorization, 'Basic dXNlcjpwYXNzd29yZA==']
        - [X-Other-Header, 'still-here']
        - [uuid, proxy-auth-default]

    proxy-request:
      headers:
        fields:
        - [Proxy-Authorization, { as: absent }]
        - [X-Other-Header, { value: 'still-here', as: equal }]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, '4']
      content:
        encoding: plain
        data: data

    proxy-response:
      status: 200
