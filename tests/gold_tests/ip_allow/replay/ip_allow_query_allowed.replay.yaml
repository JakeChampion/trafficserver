#
# Verify that ip_allow.yaml accepts QUERY as a standard method name. QUERY is in
# the allow list here, so it is proxied, while POST, which is not in the list, is
# rejected with a 403. The POST is the control: without it a rule that silently
# failed to parse and allowed everything would still pass.
#

meta:
  version: "1.0"

autest:
  description: 'Verify ip_allow.yaml allows a QUERY listed in its methods'

  server:
    name: 'server-ip-allow-query-allowed'

  client:
    name: 'client-ip-allow-query-allowed'

  ats:
    name: 'ts-ip-allow-query-allowed'
    process_config:
      enable_cache: false

    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'ip_allow|http'

    ip_allow_yaml:
      ip_allow:
      - apply: in
        ip_addrs: 0/0
        action: allow
        methods: [GET, HEAD, QUERY]

    remap_config:
      - from: /
        to: http://127.0.0.1:{SERVER_HTTP_PORT}/

    log_validation:
      traffic_out:
        contains:
        - expression: "denial for 'POST' from 127.0.0.1"
          description: 'The POST request should be denied by ip_allow'
        excludes:
        - expression: "denial for 'QUERY' from 127.0.0.1"
          description: 'The QUERY request should not be denied by ip_allow'

sessions:
- transactions:

  # QUERY is in the allow list, so it reaches the origin.
  - client-request:
      method: "QUERY"
      version: "1.1"
      url: /ip_allow/allowed/query
      headers:
        fields:
        - [ Host, example.com ]
        - [ Content-Type, application/sql ]
        - [ Content-Length, 16 ]
        - [ uuid, ip-allow-query ]
      content:
        encoding: plain
        data: "query-body-alpha"

    proxy-request:
      method: "QUERY"
      content:
        verify: { value: "query-body-alpha", as: equal }

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 16 ]
        - [ X-Response, allowed_query_response ]

    proxy-response:
      status: 200
      headers:
        fields:
        - [ X-Response, { value: allowed_query_response, as: equal } ]

  # GET is in the allow list too.
  - client-request:
      method: "GET"
      version: "1.1"
      url: /ip_allow/allowed/get
      headers:
        fields:
        - [ Host, example.com ]
        - [ uuid, ip-allow-get ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 16 ]
        - [ X-Response, allowed_get_response ]

    proxy-response:
      status: 200
      headers:
        fields:
        - [ X-Response, { value: allowed_get_response, as: equal } ]

  # POST is not in the allow list and is rejected.
  - client-request:
      method: "POST"
      version: "1.1"
      url: /ip_allow/denied/post
      headers:
        fields:
        - [ Host, example.com ]
        - [ Content-Length, 16 ]
        - [ uuid, ip-allow-post ]
      content:
        encoding: plain
        data: "query-body-alpha"

    proxy-request:
      expect: absent

    # Not received: ATS rejects the request itself.
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 16 ]

    proxy-response:
      status: 403
