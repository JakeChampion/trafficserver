#
# proxy.config.http.global_user_agent_header overrides the User-Agent header
# on every request that is forwarded to the origin. A client provided
# User-Agent is replaced and a missing User-Agent is added.
#

meta:
  version: "1.0"

autest:
  description: 'Verify global_user_agent_header overrides the origin-bound User-Agent'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'

    process_config:
      enable_cache: false

    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'http'
      proxy.config.http.global_user_agent_header: 'ATS-Global-Agent/1.0'

    remap_config:
      - 'map http://example.com/ http://127.0.0.1:{SERVER_HTTP_PORT}/'

sessions:
- transactions:

  # The client's own User-Agent is replaced with the configured value.
  - client-request:
      method: GET
      url: /ua/replaced
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [User-Agent, 'client-agent/2.0']
        - [uuid, ua-replaced]

    proxy-request:
      headers:
        fields:
        - [User-Agent, { value: 'ATS-Global-Agent/1.0', as: equal }]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, '4']
      content:
        encoding: plain
        data: data

    proxy-response:
      status: 200

  # A request without a User-Agent gets the configured value added.
  - client-request:
      method: GET
      url: /ua/added
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, ua-added]

    proxy-request:
      headers:
        fields:
        - [User-Agent, { value: 'ATS-Global-Agent/1.0', as: equal }]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, '4']
      content:
        encoding: plain
        data: data

    proxy-response:
      status: 200
