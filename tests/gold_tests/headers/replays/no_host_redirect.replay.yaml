#
# In reverse proxy mode a request that carries no Host information cannot be
# remapped. By default ATS answers 400 "Host Header Required", but when
# proxy.config.header.parse.no_host_url_redirect is set ATS instead sends a
# 302 pointing at the configured explanatory URL. An HTTP/1.0 request is used
# because HTTP/1.1 requires a Host header at parse time.
#

meta:
  version: "1.0"

autest:
  description: 'Verify no_host_url_redirect sends a 302 for requests without a Host'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'

    process_config:
      enable_cache: false

    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'http'
      proxy.config.header.parse.no_host_url_redirect: 'http://redirect.example.com/index.html'

    remap_config:
      - 'map http://example.com/ http://127.0.0.1:{SERVER_HTTP_PORT}/'

sessions:
- transactions:

  # No Host header and an origin-form URL: the request cannot be remapped, so
  # ATS must respond with a redirect to the configured URL. The origin is
  # never contacted.
  - client-request:
      method: GET
      url: /no/host/here
      version: '1.0'
      headers:
        fields:
        - [uuid, no-host-redirect]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, '0']

    proxy-response:
      status: 302
      headers:
        fields:
        - [Location, { value: 'http://redirect.example.com/index.html', as: equal }]
