#
# proxy.config.http.send_http11_requests=0 means ATS must never speak
# HTTP/1.1 to the origin: the outgoing request is downgraded to HTTP/1.0 even
# though the client used HTTP/1.1. The outgoing request line is observed via
# the http_hdrs header dump in the debug log.
#

meta:
  version: "1.0"

autest:
  description: 'Verify send_http11_requests=0 downgrades origin requests to HTTP/1.0'

  server:
    name: 'server-http10'

  client:
    name: 'client-http10'

  ats:
    name: 'ts-http10'

    process_config:
      enable_cache: false

    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'http|http_hdrs'
      proxy.config.http.send_http11_requests: 0

    remap_config:
      - 'map http://example.com/ http://127.0.0.1:{SERVER_HTTP_PORT}/'

    log_validation:
      traffic_out:
        contains:
          - expression: 'GET /outbound-version-check HTTP/1\.0'
            description: 'The origin-bound request must be HTTP/1.0'

sessions:
- transactions:

  - client-request:
      method: GET
      url: /outbound-version-check
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, send-http10]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, '4']
      content:
        encoding: plain
        data: data

    proxy-response:
      status: 200
